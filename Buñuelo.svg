<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bunGradient" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFD27A"/>
      <stop offset="55%" stop-color="#F4A93A"/>
      <stop offset="100%" stop-color="#D9890F"/>
    </radialGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A86B2D"/>
      <stop offset="100%" stop-color="#7A4A1C"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C34D"/>
      <stop offset="100%" stop-color="#E2A21E"/>
    </linearGradient>
    <linearGradient id="mugGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C3E2B"/>
      <stop offset="100%" stop-color="#6E2A1D"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#F5F0E8"/>
  <!-- Wall -->
  <rect x="0" y="0" width="1200" height="540" fill="#F6E0C6"/>

  <!-- Chalkboard -->
  <rect x="120" y="80" width="960" height="360" rx="24" fill="#2E6B57" stroke="#1E4A3B" stroke-width="8" filter="url(#shadow)"/>
  <rect x="120" y="420" width="960" height="20" fill="#B9824A"/>

  <!-- Chalkboard math text -->
  <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif">
    <text x="160" y="160" font-size="44">∫∫ dx</text>
    <text x="300" y="160" font-size="44">=</text>
    <text x="360" y="160" font-size="44">dy</text>
    <text x="420" y="144" font-size="26">dx</text>
    <text x="460" y="160" font-size="44">,  x² + y = 1</text>

    <text x="160" y="240" font-size="44">Σ</text>
    <text x="210" y="240" font-size="44">k=1</text>
    <text x="330" y="240" font-size="44">(2k + 1)</text>

    <text x="160" y="320" font-size="44">A =</text>
    <rect x="250" y="276" width="140" height="90" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="270" y="312" font-size="40">1   0</text>
    <text x="270" y="352" font-size="40">0  -1</text>
  </g>

  <!-- Desk -->
  <rect x="0" y="540" width="1200" height="360" fill="url(#deskGrad)"/>

  <!-- Buñuelo body -->
  <circle cx="600" cy="540" r="210" fill="url(#bunGradient)" filter="url(#shadow)"/>

  <!-- Bite (overlay circles in wall color) -->
  <g fill="#F6E0C6">
    <circle cx="720" cy="370" r="26"/>
    <circle cx="690" cy="352" r="18"/>
    <circle cx="660" cy="362" r="16"/>
    <circle cx="740" cy="392" r="20"/>
  </g>

  <!-- Face -->
  <!-- Eyes -->
  <circle cx="540" cy="520" r="18" fill="#1E1E1E"/>
  <circle cx="660" cy="520" r="18" fill="#1E1E1E"/>
  <!-- Cheeks -->
  <circle cx="505" cy="560" r="12" fill="#F39A7A" opacity="0.6"/>
  <circle cx="695" cy="560" r="12" fill="#F39A7A" opacity="0.6"/>
  <!-- Smile -->
  <path d="M540,585 C560,605 640,605 660,585" fill="none" stroke="#7A3D0B" stroke-width="8" stroke-linecap="round"/>

  <!-- Glasses -->
  <circle cx="540" cy="520" r="46" fill="none" stroke="#333333" stroke-width="8"/>
  <circle cx="660" cy="520" r="46" fill="none" stroke="#333333" stroke-width="8"/>
  <rect x="585" y="512" width="30" height="8" fill="#333333"/>

  <!-- Arms -->
  <path d="M430,620 C480,590 520,600 560,640" fill="none" stroke="#D9890F" stroke-width="26" stroke-linecap="round"/>
  <path d="M770,620 C720,590 680,600 640,640" fill="none" stroke="#D9890F" stroke-width="26" stroke-linecap="round"/>

  <!-- Notebook -->
  <rect x="420" y="670" width="360" height="110" rx="8" fill="#FDFCF8" stroke="#D3D3D3" stroke-width="4" filter="url(#shadow)"/>
  <line x1="435" y1="690" x2="765" y2="690" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="435" y1="710" x2="765" y2="710" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="435" y1="730" x2="765" y2="730" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="435" y1="750" x2="765" y2="750" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Math in notebook -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#3A3A3A">
    <text x="450" y="722" font-size="26">∫ (2x + 1) dx</text>
    <text x="600" y="742" font-size="24">= x² + x + C</text>
  </g>

  <!-- Pencil -->
  <g transform="translate(620,660) rotate(-15)">
    <rect x="0" y="0" width="160" height="18" rx="9" fill="url(#pencilGrad)" stroke="#C58A18" stroke-width="2"/>
    <polygon points="160,9 190,0 190,18" fill="#F5D0AE" stroke="#B3835C" stroke-width="2"/>
    <polygon points="190,0 205,9 190,18" fill="#4A4A4A"/>
    <rect x="-18" y="0" width="18" height="18" fill="#E86D6D" stroke="#C85555" stroke-width="2"/>
  </g>

  <!-- Colombian flag -->
  <g transform="translate(880,640)">
    <rect x="0" y="0" width="8" height="90" fill="#704A1D"/>
    <rect x="12" y="10" width="96" height="60" fill="#F9D21C" stroke="#333" stroke-width="2"/>
    <rect x="12" y="50" width="96" height="20" fill="#21449C"/>
    <rect x="12" y="70" width="96" height="20" fill="#CE2A1D"/>
  </g>

  <!-- Mug of tinto -->
  <g transform="translate(250,690)">
    <rect x="0" y="0" width="120" height="90" rx="16" fill="url(#mugGrad)" stroke="#3E1B13" stroke-width="4" filter="url(#shadow)"/>
    <path d="M120,25 C150,15 150,75 120,65" fill="none" stroke="#9C3E2B" stroke-width="16"/>
    <text x="16" y="58" font-size="34" font-family="Verdana, Geneva, sans-serif" fill="#FCE8DA" font-weight="bold">TINTO</text>
    <!-- Steam -->
    <path d="M30,-10 C20,-25 40,-40 30,-55" stroke="#BCAAA4" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M60,-10 C50,-25 70,-40 60,-55" stroke="#BCAAA4" stroke-width="4" fill="none" opacity="0.6"/>
  </g>

  <!-- Desk edge highlight -->
  <rect x="0" y="540" width="1200" height="8" fill="#C28B4E" opacity="0.7"/>
</svg>
